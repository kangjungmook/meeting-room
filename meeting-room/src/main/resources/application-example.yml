server:
  address: 0.0.0.0

app:
  jwt:
    secret: your-jwt-secret-key-must-be-at-least-32-bytes

logging:
  level:
    "[org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]]": OFF
    "[org.apache.catalina.connector.CoyoteAdapter]": OFF

spring:
  profiles:
    active: dev

  jackson:
    time-zone: Asia/Seoul

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/room_db?serverTimezone=Asia/Seoul
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://YOUR_DB_HOST:3306/room_db?serverTimezone=Asia/Seoul
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080
  ssl:
    enabled: true
    key-store: file:YOUR_KEYSTORE_PATH
    key-store-password: YOUR_KEYSTORE_PASSWORD
    key-store-type: PKCS12
    key-alias: YOUR_KEY_ALIAS
